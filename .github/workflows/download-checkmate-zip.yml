name: Build CHECKMATE updated ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - splash-update
    paths:
      - '.github/workflows/download-checkmate-zip.yml'
      - 'patches/**'
      - '*.zip'

permissions:
  contents: read

jobs:
  build-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and patch project
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=( *.zip )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No source ZIP found in repository root."
            exit 1
          fi
          mkdir -p patched
          unzip -q "${files[0]}" -d patched
          project_file="$(find patched -name project.godot -print -quit)"
          if [ -z "$project_file" ]; then
            echo "project.godot was not found in source archive."
            exit 1
          fi
          project_dir="$(dirname "$project_file")"
          mkdir -p "$project_dir/patches"
          cp patches/apply_patch.py "$project_dir/patches/apply_patch.py"
          python "$project_dir/patches/apply_patch.py"
          (cd patched && zip -qr "$GITHUB_WORKSPACE/CHECKMATE_preparation_zloty_v14.zip" "$(basename "$project_dir")")
          unzip -t "$GITHUB_WORKSPACE/CHECKMATE_preparation_zloty_v14.zip"

      - name: Upload updated CHECKMATE project
        uses: actions/upload-artifact@v4
        with:
          name: CHECKMATE-preparation-zloty-v14
          path: CHECKMATE_preparation_zloty_v14.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
